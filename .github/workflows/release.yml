name: Release

# Tag a release to publish everywhere:
#   git tag v4.5.0 && git push origin v4.5.0
#
# Publishing is gated on secrets/OIDC being configured:
#   • PyPI  — Trusted Publishing (recommended, no token) OR a PYPI_API_TOKEN secret.
#   • npm   — an NPM_TOKEN secret.
# If a credential is absent, that publish step is skipped (the build + GitHub
# Release still run), so this never fails a release just because a token is unset.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # PyPI Trusted Publishing (OIDC)

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions agree (tag, pyproject, package, npm)
        run: |
          python - <<'PY'
          import json, os, re, sys
          py = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          pkg = re.search(r'__version__ = "([^"]+)"', open("openleads/__init__.py").read()).group(1)
          npm = json.load(open("npm/package.json"))["version"]
          ref = os.environ.get("GITHUB_REF", "")
          tag = ref.rsplit("/v", 1)[1] if ref.startswith("refs/tags/v") else py
          print(f"tag={tag} pyproject={py} package={pkg} npm={npm}")
          sys.exit(0 if len({tag, py, pkg, npm}) == 1 else "version mismatch")
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Verify the dashboard shipped in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["openleads/web/static/index.html", "openleads/web/static/app.js",
                  "openleads/web/static/styles.css"]
          missing = [n for n in need if n not in names]
          print("wheel:", whl)
          assert not missing, f"missing from wheel: {missing}"
          print("OK — local dashboard is bundled.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      # Prefer Trusted Publishing (no token) when enabled on PyPI; else use a token
      # if one is set. With neither configured, both steps are skipped cleanly —
      # no misleading green, no accidental publish.
      - name: Publish (Trusted Publishing / OIDC)
        if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish (API token)
        if: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'true' && env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: No PyPI credentials configured
        if: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'true' && env.PYPI_API_TOKEN == '' }}
        run: |
          echo "::notice::Skipping PyPI publish — set up Trusted Publishing (repo var"
          echo "PYPI_TRUSTED_PUBLISHING=true) or add a PYPI_API_TOKEN secret to enable it."

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write   # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Bundle the license with the npm package
        run: cp LICENSE npm/LICENSE
      - name: Publish npm wrapper
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
