name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (zero-dep core) + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint (critical errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI (zero-dependency core)
        run: |
          python -c "import openleads; print('openleads', openleads.__version__, 'imports with stdlib only')"
          openleads --version
          openleads sources

      - name: MCP handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
                        '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | openleads mcp | python -c "import sys,json; r=[json.loads(l) for l in sys.stdin]; assert r[1]['result']['tools'], r; print('mcp ok')"

  dashboard:
    name: dashboard + workspace smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every dashboard ES module
        run: |
          tmp=$(mktemp -d)
          find openleads/web/static -name '*.js' | while read -r f; do
            out="$tmp/$(echo "$f" | tr '/' '_').mjs"
            cp "$f" "$out"
            node --check "$out" || { echo "::error file=$f::syntax error"; exit 1; }
          done
          echo "checked $(find openleads/web/static -name '*.js' | wc -l) modules"
      - name: Test workflow interactions (offline)
        run: node --experimental-vm-modules --test tests/js/*.test.mjs
      - run: python -m pip install .
      - name: Demo workspace and workspace CLI
        run: |
          openleads demo --no-serve --dir "$RUNNER_TEMP/demo"
          export OPENLEADS_HOME="$RUNNER_TEMP/demo"
          openleads stats
          openleads people --fit A --limit 5
          openleads companies --tech HubSpot
          openleads seq show 1
          openleads seq run 1
          openleads tasks
          openleads deals
          openleads dedupe
      - name: Dashboard serves every module the shell imports
        run: |
          export OPENLEADS_HOME="$RUNNER_TEMP/demo"
          (openleads web --no-open --port 8799 &) ; sleep 2
          python - <<'PY'
          import json, re, urllib.request
          base = "http://127.0.0.1:8799/"
          seen, todo = set(), ["app.js"]
          while todo:
              path = todo.pop()
              if path in seen:
                  continue
              seen.add(path)
              body = urllib.request.urlopen(base + path, timeout=10).read().decode()
              d = path.rsplit("/", 1)[0] + "/" if "/" in path else ""
              for m in re.findall(r'(?:import|from)\s*["\'](\.\.?/[^"\']+)["\']', body):
                  parts = (d + m).split("/")
                  out = []
                  for p in parts:
                      if p == "..": out.pop()
                      elif p not in (".", ""): out.append(p)
                  todo.append("/".join(out))
          print(len(seen), "modules served")
          for ep in ("api/home", "api/meta", "api/health", "api/tasks", "api/deals", "api/sequences"):
              json.load(urllib.request.urlopen(base + ep, timeout=10))
          print("workspace API ok")
          PY

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install .
      - run: openleads --version
      - run: openleads sources
      - run: python -c "from openleads.automate import scheduler as s; print(s.schtasks_args(None)); print(s.cron_line(None))"
      - run: node --check npm/bin/openleads.js
