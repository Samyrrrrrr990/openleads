name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (zero-dep core) + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint (critical errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI (zero-dependency core)
        run: |
          python -c "import openleads; print('openleads', openleads.__version__, 'imports with stdlib only')"
          openleads --version
          openleads sources

      - name: MCP handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
                        '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | openleads mcp | python -c "import sys,json; r=[json.loads(l) for l in sys.stdin]; assert r[1]['result']['tools'], r; print('mcp ok')"

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install .
      - run: openleads --version
      - run: openleads sources
      - run: python -c "from openleads.automate import scheduler as s; print(s.schtasks_args(None)); print(s.cron_line(None))"
      - run: node --check npm/bin/openleads.js
