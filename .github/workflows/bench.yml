name: Live benchmark

# Runs the real-query benchmark against live sources every night and commits the
# scoreboard (BENCHMARK.md + bench/latest.json). Unit tests mock the network; this
# is the check that searches actually return the right people.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit the scoreboard to this branch (off: results are uploaded as an artifact only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - name: Run benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bench
          openleads bench --no-cache --json bench/latest.json --markdown BENCHMARK.md
      - name: Print the scoreboard
        if: always()
        run: cat BENCHMARK.md || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            BENCHMARK.md
            bench/latest.json
      - name: Commit scoreboard
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          git config user.name "openleads-bench"
          git config user.email "openleads-bench@users.noreply.github.com"
          git add BENCHMARK.md bench/latest.json
          git diff --cached --quiet || git commit -m "bench: nightly live benchmark [skip ci]"
          git push || echo "::notice::scoreboard not pushed (branch protected?)"
