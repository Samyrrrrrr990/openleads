<div class="app" id="app">
  <nav class="nav" aria-label="Primary">
    <div class="nav__brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-logo"/></svg></span>
      <span class="wordmark">open<b>leads</b></span>
      <span class="nav__ver" id="version"></span>
    </div>
    <button class="nav__search" data-global="palette" title="Search and jump anywhere (⌘K)">
      <svg class="ico"><use href="#i-find"/></svg><span>Search or jump to…</span><kbd>⌘K</kbd>
    </button>
    <div class="nav__scroll" id="nav-links"></div>
    <div class="nav__foot">
      <div class="nav__row" title="Sender readiness (SPF/DKIM/DMARC) from Doctor">
        <svg class="ico ico--sm"><use href="#i-shield"/></svg>
        <span class="nav__label">Deliverability</span>
        <span class="spacer"></span>
        <span class="nav__grade" id="readiness">—</span>
      </div>
      <div class="nav__row">
        <button class="btn btn--ghost btn--icon btn--sm" data-global="theme" title="Toggle theme (T)"><svg class="ico"><use href="#i-moon"/></svg></button>
        <button class="btn btn--ghost btn--icon btn--sm" data-global="collapse" title="Collapse sidebar"><svg class="ico"><use href="#i-sidebar"/></svg></button>
        <button class="btn btn--ghost btn--icon btn--sm" data-global="shortcuts" title="Keyboard shortcuts (?)"><svg class="ico"><use href="#i-keyboard"/></svg></button>
        <span class="spacer"></span>
        <span class="nav__label nav__local faint" title="Everything runs on this machine">Local</span>
      </div>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
